name: Build Sanaye Abomoslem APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sanaye/abomoslem
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SanayeAbomoslem"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sanaye.abomoslem'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.sanaye.abomoslem'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#17365D</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="صنایع ابومسلم"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sanaye/abomoslem/MainActivity.java <<'EOF'
          package com.sanaye.abomoslem;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>صنایع ابومسلم</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#f2f5f8;font-family:Tahoma,Arial,sans-serif;color:#17202a}
          header{background:#17365d;color:white;padding:20px;text-align:center}
          header h1{margin:0;font-size:23px}
          header p{margin:8px 0 0;font-size:13px}
          .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
          button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:bold}
          .tab{background:white;color:#17365d;box-shadow:0 2px 7px #ccd3db}
          .tab.active{background:#17365d;color:white}
          .card{background:white;margin:0 14px 14px;padding:16px;border-radius:16px;box-shadow:0 2px 8px #d5dbe1}
          h2{font-size:18px;margin-top:0}
          label{display:block;font-size:13px;margin:10px 0 5px}
          input,select{width:100%;padding:12px;border:1px solid #ccd3db;border-radius:9px;font-size:16px}
          .calc{width:100%;background:#1b7f45;color:white;margin-top:15px}
          .result{margin-top:15px;background:#eef7f1;border-radius:10px;padding:12px;line-height:2;font-size:14px}
          .hidden{display:none}
          .price{font-weight:bold}
          .footer{text-align:center;padding:15px;color:#65717d;font-size:12px}
          </style>
          </head>
          <body>
          <header>
            <h1>نرم افزار صنایع ابومسلم</h1>
            <p>طراحی، محاسبه قیمت و پیش‌فاکتور</p>
          </header>

          <div class="tabs">
            <button class="tab active" onclick="show('upvc',this)">UPVC</button>
            <button class="tab" onclick="show('shutter',this)">کرکره برقی</button>
            <button class="tab" onclick="show('glass',this)">شیشه سکوریت</button>
            <button class="tab" onclick="show('operator',this)">اپراتور</button>
          </div>

          <section id="upvc" class="card">
            <h2>محاسبه پنجره UPVC</h2>

            <label>عرض پنجره (سانتی‌متر)</label>
            <input id="w" type="number" value="150">

            <label>ارتفاع پنجره (سانتی‌متر)</label>
            <input id="h" type="number" value="150">

            <label>نوع پنجره</label>
            <select id="type">
              <option>تک‌لنگه</option>
              <option>دو لنگه</option>
              <option>درب</option>
            </select>

            <label>پروفیل</label>
            <select>
              <option>MAVI</option>
              <option>ABAYAN GREEN</option>
              <option>HONEYCOMB</option>
              <option>رووتک</option>
            </select>

            <label>قیمت پروفیل لنگه - ریال/متر</label>
            <input id="p" type="number" value="850000">

            <label>قیمت شیشه - ریال/مترمربع</label>
            <input id="g" type="number" value="1800000">

            <button class="calc" onclick="calc()">محاسبه</button>

            <div id="result" class="result">
              ابعاد را وارد کنید و روی محاسبه بزنید.
            </div>
          </section>

          <section id="shutter" class="card hidden">
            <h2>کرکره برقی</h2>
            <label>عرض (سانتی‌متر)</label>
            <input type="number" value="300">
            <label>ارتفاع (سانتی‌متر)</label>
            <input type="number" value="250">
            <label>قیمت هر مترمربع - ریال</label>
            <input type="number" value="0">
            <button class="calc">محاسبه کرکره</button>
          </section>

          <section id="glass" class="card hidden">
            <h2>شیشه سکوریت</h2>
            <label>عرض (سانتی‌متر)</label>
            <input type="number" value="100">
            <label>ارتفاع (سانتی‌متر)</label>
            <input type="number" value="200">
            <label>ضخامت</label>
            <select>
              <option>4 میلی‌متر</option>
              <option>5 میلی‌متر</option>
              <option>6 میلی‌متر</option>
              <option>8 میلی‌متر</option>
              <option>10 میلی‌متر</option>
            </select>
            <button class="calc">محاسبه شیشه</button>
          </section>

          <section id="operator" class="card hidden">
            <h2>درب اتوماتیک / اپراتور</h2>
            <label>عرض دهانه (سانتی‌متر)</label>
            <input type="number" value="150">
            <label>ارتفاع دهانه (سانتی‌متر)</label>
            <input type="number" value="220">
            <button class="calc">محاسبه اپراتور</button>
          </section>

          <div class="footer">
            صنایع ابومسلم<br>
            09232800757 &nbsp; | &nbsp; WhatsApp: 09366354407
          </div>

          <script>
          function show(id,btn){
            document.querySelectorAll('section').forEach(x=>x.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
            btn.classList.add('active');
          }

          function calc(){
            let w=Number(document.getElementById('w').value);
            let h=Number(document.getElementById('h').value);
            let pp=Number(document.getElementById('p').value);
            let gp=Number(document.getElementById('g').value);

            let mullion=w-12;
            let sashW=(w-28)/2;
            let sashH=h-14;
            let glassW=sashW-6;
            let glassH=sashH-6;

            let profile=((2*sashW+2*sashH)*2+mullion)/100;
            let glass=(glassW*glassH*2)/10000;
            let profileCost=profile*pp;
            let glassCost=glass*gp;
            let subtotal=profileCost+glassCost;
            let profit=subtotal*.10;
            let total=subtotal+profit;

            document.getElementById('result').innerHTML=
              '<b>نتیجه محاسبه</b><br>'+
              'مولیون: '+mullion.toFixed(1)+' سانتی‌متر<br>'+
              'لنگه: '+sashW.toFixed(1)+' × '+sashH.toFixed(1)+' سانتی‌متر<br>'+
              'شیشه: '+glassW.toFixed(1)+' × '+glassH.toFixed(1)+' سانتی‌متر<br>'+
              'متراژ تقریبی پروفیل: '+profile.toFixed(2)+' متر<br>'+
              'مساحت شیشه: '+glass.toFixed(2)+' مترمربع<br>'+
              'جمع مصالح: '+Math.round(subtotal).toLocaleString('fa-IR')+' ریال<br>'+
              'سود ۱۰٪: '+Math.round(profit).toLocaleString('fa-IR')+' ریال<br>'+
              '<b>قیمت نهایی: '+Math.round(total).toLocaleString('fa-IR')+' ریال</b>';
          }
          </script>
          </body>
          </html>
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanaye-abomoslem-apk
          path: app/build/outputs/apk/debug/app-debug.apkg
